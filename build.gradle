plugins {
    id 'java'
    id 'application'
    id 'jacoco'       
    id 'checkstyle'   
}


repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.calculator.Main'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport 
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test 
    reports {
        xml.required = true
        html.required = true
    }
}

checkstyle {
    toolVersion = "10.12.5"
    ignoreFailures = true 
}